name: Publish Zelda v1.1 archive
on:
  push:
    paths:
      - '.v11-transfer/zelda-v1.1.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Stage v1.1 archive for assembly')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble verified archive and update public links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, hashlib, zipfile
          parts=sorted(Path('.v11-transfer').glob('zelda-v1.1.part*'))
          assert len(parts)==7, f'Expected 7 transfer chunks, got {len(parts)}'
          content=b''.join(p.read_bytes() for p in parts)
          raw=base64.b64decode(content,validate=True)
          assert len(raw)==3668739, 'Size mismatch'
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='a951a5c2df31d89e5c50d526488d139984b3daf3d4f596b36f7be64e238e8f49', 'SHA-256 mismatch'
          with zipfile.ZipFile(BytesIO(raw)) as z:
              assert z.testzip() is None, 'Corrupt ZIP contents'
              assert any(n.startswith('TurkceYama/romfs/') for n in z.namelist()), 'Mod folder is missing'
          Path('downloads/Zelda_OOT_Turkce_Yama_v1.1.zip').write_bytes(raw)
          for doc in ['README.md','KURULUM.md','KURULUM.txt','index.html','kurulum.html']:
              p=Path(doc)
              body=p.read_text(encoding='utf-8')
              assert 'v1.0' in body, f'No prior version marker in {doc}'
              p.write_text(body.replace('v1.0','v1.1'),encoding='utf-8')
          Path('downloads/Zelda_OOT_Turkce_Yama_v1.0.zip').unlink()
          for p in parts: p.unlink()
          Path('.v11-transfer').rmdir()
          print('Published exact validated v1.1 ZIP, digest:',digest)
          PY
      - name: Commit updated ZIP and links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish updated Zelda Turkish patch v1.1"
          git push
